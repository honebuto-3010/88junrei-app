<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禅師峰寺</title>
    <link rel="stylesheet" href="css/kochi.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">三十二番札所</p>

    <h2 class="card-title">
        <ruby>
            八葉山・禅師峰寺
            <rt>はちようざん・ぜんじぶじ</rt>
        </ruby>
    </h2>

    <p class="card-address">高知県南国市十市3084</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・豊山派</p>
        <p><strong>御本尊：</strong> 十一面観世音菩薩</p>
        <p><strong>ご利益：</strong> 海洋安全</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（30台・無料）</p>
        <p><strong>納経所：</strong> 駐車場から山門へ行く途中</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=禅師峰寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        境内には大小様々な奇岩や石仏があり、その周りを取り囲むように石仏が祀られている。標高82mの高台から土佐湾が一望できる。
    </p>

</div>
