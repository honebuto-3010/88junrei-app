<head>
    <meta charset="UTF-8">

    <title>岩本寺</title>
    <link rel="stylesheet" href="css/kochi.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Tosa/kochi-134843608.jpg" alt="">

    <p class="card-number">三十七番札所</p>

    <h2 class="card-title">
        <ruby>
            藤井山・岩本寺
            <rt>ふじいさん・いわもとじ</rt>
        </ruby>
    </h2>

    <p class="card-address">高知県高知群四万十町茂串町3-13</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・智山派</p>
        <p><strong>御本尊：</strong> 阿弥陀如来・不動明王・観世音菩薩・地蔵菩薩・薬師如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（道を挟んで山門・20台・協力金）</p>
        <p><strong>納経所：</strong> 山門入って左すぐ</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり（1泊2食付7100円・予約制）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=高知県　岩本寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        四国八十八ヶ所で唯一、五尊の本尊を安置する寺。「三度栗」、子安桜」など弘法大師にちなんだ七不思議がある。
        本堂の天井絵もユニークで様々な絵が描かれている。
    </p>

</div>
