<div class="card-brush">

        <ruby>
            医王山・清滝寺
            <rt>いおうざん・きよたきじ</rt>
        </ruby>
    </h2>

    <p class="card-address">高知県土佐市高岡町丁568-1</p>

        <p><strong>宗派：</strong> 真言宗・豊山派</p>

        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=清滝寺" target="_blank">地図を見る</a>
        </p>

    <p class="card-desc">
        古くから厄除けのご利益があるとして、多くの参拝客が訪れる。高さ12mもある薬師如来像の真っ暗な内部を手探りで進む
        「戒壇めぐり」もある。
