<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最御崎寺</title>
    <link rel="stylesheet" href="css/kochi.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Tosa/kochi-134843608.jpg" alt="">

    <p class="card-number">二十四番札所</p>

    <h2 class="card-title">
        <ruby>
            室戸山・最御崎寺
            <rt>むろとざん・ほつみさきじ</rt>
        </ruby>
    </h2>

    <p class="card-address">高知県室戸市室戸岬町4058-1</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・豊山派</p>
        <p><strong>御本尊：</strong> 虚空蔵菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（仁王門まで10分程度・階段より右横の舗装路へ・37台・無料）</p>
        <p><strong>納経所：</strong> 本堂横</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり（1泊2食付6500円）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=高知県　最御崎寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        国の重要文化財として「宝物館」がある。なかでも石造如意輪観音半跏像が有名。木造薬師如来像や木造月光菩薩立像、
        三足の「漆塗台盤」などがある。
    </p>

</div>
