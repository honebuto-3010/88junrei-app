<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金剛福寺</title>
    <link rel="stylesheet" href="css/kochi.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Tosa/kochi-134843608.jpg" alt="">

    <p class="card-number">三十八番札所</p>

    <h2 class="card-title">
        <ruby>
            蹉跎山・金剛福寺
            <rt>さだざん・こんごうふくじ</rt>
        </ruby>
    </h2>

    <p class="card-address">高知県土佐清水市足摺岬214-1</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・豊山派</p>
        <p><strong>御本尊：</strong> 三面千手観音菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（徒歩すぐ・40台・無料・足摺岬と共用）</p>
        <p><strong>納経所：</strong> 本堂手前右</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり（1泊2食付・7000円・予約制）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=金剛福寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        境内に亜熱帯植物が見られ、四国最南端の岬に建つ札所。「大師亀」の頭を願いを念じながらなでると幸運が訪れる。
        源氏一門が建立したといわれる多宝塔があり、和泉式部が黒髪を埋めたとされる逆修塔が後方に建つ。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
