<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>種間寺</title>
    <link rel="stylesheet" href="css/kochi.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">三十四番札所</p>

    <h2 class="card-title">
        <ruby>
            本尾山・種間寺
            <rt>もとおざん・たねまじ</rt>
        </ruby>
    </h2>

    <p class="card-address">高知県高知市春野町秋山72</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・豊山派</p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong> 安産</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（70台・無料）</p>
        <p><strong>納経所：</strong> 門柱を入って右手の建物</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=種間寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        弘法大師が唐から持ち帰った五穀の種を蒔いたという伝承から名付けられた。安産祈願の禅寺と信仰され、底の抜けた柄杓が
        数多く奉納されたいる。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>

</html>
