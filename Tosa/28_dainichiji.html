<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">二十八番札所</p>

    <h2 class="card-title">
        <ruby>
            法界山・大日寺
            <rt>ほうかいざん・だいにちじ</rt>
        </ruby>
    </h2>

    <p class="card-address">高知県香南市野市町母代寺476</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・智山派</p>
        <p><strong>御本尊：</strong> 大日如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（山門入り口付近・30台・無料）</p>
        <p><strong>納経所：</strong> 少し離れているが指示に沿って行ける</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=大日寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        1983年に改修された大師堂、自然に囲まれた重厚な鐘楼は多くの参拝客に慕われている。
    </p>

</div>
