<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霊山寺</title>
    <link rel="stylesheet" href="../css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="134843608.jpg" alt="巡拝">

    <p class="card-number">一番札所</p>

    <h2 class="card-title">
        <ruby>
            竺和山・霊山寺
            <rt>じくわざん・りょうぜんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県鳴門市大麻町板東字塚鼻126</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 釈迦如来</p>
        <p><strong>ご利益：</strong> 厄除け・縁結び</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（境内に隣接・100台・無料）</p>
        <p><strong>納経所：</strong> 本堂横</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=霊山寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        四国八十八ヶ所のお遍路さんはここからスタートします。
        大麻比古神社もあり、多くの人が訪れています。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>

</html>
