<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>井戸寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/134843608.jpg" alt="">

    <p class="card-number">十七番札所</p>

    <h2 class="card-title">
        <ruby>
             瑠璃山・井戸寺
            <rt>るりざん・いどじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県徳島市国府町井戸北屋敷80-1</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・善通寺派</p>
        <p><strong>御本尊：</strong> 七仏薬師如来</p>
        <p><strong>ご利益：</strong>  </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（本堂裏にあるので注意。北側の県道30号からアプローチできる・30台・無料）</p>
        <p><strong>納経所：</strong> 大門をくぐって左手の奥</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=井戸寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        「面影の井戸」と呼ばれる、大師が自分の杖で一夜にして掘ったという伝説の井戸がある。覗き込んで自分が映れば無病息災、映らなければ
        3年以内に不幸が訪れるとか。
    </p>

</div>
<div class="back-buttons">
