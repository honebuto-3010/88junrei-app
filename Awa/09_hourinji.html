<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>法輪寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">九番札所</p>

    <h2 class="card-title">
        <ruby>
            正覚山・法輪寺
            <rt>しょうかくざん・ほうりんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県阿波市土成町土成字田中198-2</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 涅槃釈迦如来</p>
        <p><strong>ご利益：</strong> 健康（足・腰）</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（境内横・50台・無料）</p>
        <p><strong>納経所：</strong> 門をくぐって左手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=法輪寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        健康祈願の寺としても名高い。むかし、松葉杖なしでは歩けなかった人が参拝に来たとき、参道の真ん中あたりで足が軽くなりついには
        完治したという言い伝えがある。たくさんの草履が奉納されている。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
