<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切幡寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">十番札所</p>

    <h2 class="card-title">
        <ruby>
            得度山・切幡寺
            <rt>とくどざん・きりはたじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県阿波市市場町切幡字観音129</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 千手観世音菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（階段下と境内直結の2ヶ所・20台・無料）</p>
        <p><strong>納経所：</strong> 門をくぐって左手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=切幡寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        333段の石段を上る山の中腹にある。国の重要文化財に指定されている大塔はもとは大阪の住吉神宮寺に寄進したものだが、廃寺となって10年かけて
        移築された。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>

</html>
