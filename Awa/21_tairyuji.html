<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太龍寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">二十一番札所</p>

    <h2 class="card-title">
        <ruby>
             舎心山・太龍寺
            <rt>しゃしんざん・たいりゅうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県阿南市加茂町龍山2</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 虚空蔵菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（ロープウェイ乗り場の駐車場利用・500台・無料）（ロープウェイは往復2470円：要確認）</p>
        <p><strong>納経所：</strong> 仁王門をくぐり鐘楼門の手前</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=太龍寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        標高600mにあり山頂まではロープウェイを利用すれば10分で上れる。「龍天井」は納経所のすぐ横にあり、画家竹村松嶺が書いたものである。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
