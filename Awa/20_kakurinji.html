<!DOCTYPE html>
<html lang="ja">
<head>

    <title>鶴林寺</title>

<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">二十番札所</p>

    <h2 class="card-title">
        <ruby>
             霊鷲山・鶴林寺
            <rt>りょうじゅざん・かくりんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県勝浦郡勝浦町生名鷲ヶ尾14</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 地蔵菩薩</p>
        <p><strong>ご利益：</strong>  </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（徒歩5分・20台・1回300円）</p>
        <p><strong>納経所：</strong> 大師堂横</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=鶴林寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        参道は長い階段があり、山岳霊場でもあることから難所といわれている。「三重塔」は江戸末期の建てられ、各層が
        和様、唐様などそれぞれ異なった建築手法がもちいられている。
    </p>

</div>
