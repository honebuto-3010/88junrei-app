<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熊谷寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">八番札所</p>

    <h2 class="card-title">
        <ruby>
            普明山・熊谷寺
            <rt>ふみょうざん・くまだにじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県阿波市土成町土成字前田185</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 千手観音菩薩</p>
        <p><strong>ご利益：</strong></p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（本堂まで徒歩15分・20台・志納金）</p>
        <p><strong>納経所：</strong> 駐車場に隣接</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=熊谷寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        四国霊場の木造建築物の中で最も大きい高さ13mの山門がある。とくに夕暮れ時の山門は必見。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
