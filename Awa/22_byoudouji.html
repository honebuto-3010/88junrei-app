             白水山・平等寺
            <rt>はくすいざん・びょうどうじ</rt>

        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=平等寺" target="_blank">地図を見る</a>
        </p>

    <p class="card-desc">
        大師堂の中に入り頭上を見上げるとたくさんの草花を描いた天井が広がっている。本堂にも天井画がある。長い年月が経っても変わらず
        見事な彩色である。
