<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>極楽寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">二番札所</p>

    <h2 class="card-title">
        <ruby>
            日照山・極楽寺
            <rt>にっしょうざん・ごくらくじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県鳴門市大麻町檜段の上12</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 高野山・真言宗</p>
        <p><strong>御本尊：</strong> 阿弥陀如来</p>
        <p><strong>ご利益：</strong> 安産</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（無料）・山門すぐ横</p>
        <p><strong>納経所：</strong> 個人用は山門横・団体用は山門から徒歩3分</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=徳島県　極楽寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        樹齢1200年あまり、高さ31m、周囲約6mの巨大な杉の巨木がある。美しい庭園があり、両界曼荼羅図と地獄絵図は共に県指定文化財。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
