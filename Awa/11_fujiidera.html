<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>藤井寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">十一番札所</p>

    <h2 class="card-title">
        <ruby>
            金剛山・藤井寺
            <rt>こんごうざん・ふじいでら</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県吉野川市鴨島町飯尾1525</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 臨済宗・妙心寺派</p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong> 厄除け</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> なし（近隣駐車場を利用）</p>
        <p><strong>納経所：</strong> 山門をくぐって右手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=徳島県　藤井寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        境内の一角にある白龍弁財天とは8つの手を持つ龍。金運・武術・芸術への福を授けてくれる。寺の名前は弘法大師がこの地で修行したのち、
        5色の藤を植えたことに由来する。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
