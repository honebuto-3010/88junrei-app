    <title>立江寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/134843608.jpg" alt="">

    <p class="card-number">十九番札所</p>

    <h2 class="card-title">
        <ruby>
             橋池山・立江寺
            <rt>きょうちざん・たつえじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県小松島市立江町若松13</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 延命地蔵菩薩</p>
        <p><strong>ご利益：</strong> 安産 </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（境内まで徒歩5分・30台・1回300円）</p>
        <p><strong>納経所：</strong> 本堂横</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり（1泊2食付7000円、予約制）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=立江寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        「肉付鐘の緒の黒髪堂」と呼ばれるお堂がある。不義をしたお京という女が自害しきれず四国巡礼を始め、この寺を参拝すると
        髪の毛が鐘の緒に巻き上げられて残ったという逸話がある。
    </p>

</div>
