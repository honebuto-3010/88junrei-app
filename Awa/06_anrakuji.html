<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>安楽寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">六番札所</p>

    <h2 class="card-title">
        <ruby>
            温泉山・安楽寺
            <rt>おんせんざん・あんらくじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県板野郡上板町引野字寺の西北8</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong>健康</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（県道139号沿いにあり徒歩3分・40台・無料）</p>
        <p><strong>納経所：</strong> 本堂内</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>あり（1泊2食付 7200円～、予約制）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=徳島県　安楽寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        400年の歴史を持つ宿坊がある。宿泊者だけが入れる「弘法の湯」があり、大師堂前から湧き出ている。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>

</html>
