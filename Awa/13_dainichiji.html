<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">十三番札所</p>

    <h2 class="card-title">
        <ruby>
            大栗山・大日寺
            <rt>おおぐりざん・だいにちじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県徳島市一宮町西丁263</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・大覚寺派</p>
        <p><strong>御本尊：</strong> 十一面観世音菩薩</p>
        <p><strong>ご利益：</strong> 幸福</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（徒歩5分・15台・無料）</p>
        <p><strong>納経所：</strong> 門を入って正面</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>あり（1泊2食付6500円、予約制）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=大日寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        もともと向かいの一の宮神社との間に山門があったが、道路の開通の際の撤去された。それを復元させた薬医門がある。合掌している手の中に
        蓮を持ったしあわせ観音の像がある。
    </p>

</div>
