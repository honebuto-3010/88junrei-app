    <title>恩山寺</title>

<body>
<div class="card-brush">

    <img src="Awa/134843608.jpg" alt="">

    <p class="card-number">十八番札所</p>

    <h2 class="card-title">
        <ruby>
             母養山・恩山寺
            <rt>ぼようざん・おんざんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県小松島市田野町恩山寺谷40</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong>  </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（境内まで徒歩5分・30台・無料）</p>
        <p><strong>納経所：</strong> 本堂への階段手前右</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=恩山寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        「玉依御前の剃髪所」とよばれる、弘法大師の母を祀るお堂がある。玉依御前がこの寺で出家したときの髪の毛が納められている。
    </p>

</div>
