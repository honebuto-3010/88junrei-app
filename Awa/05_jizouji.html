<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地蔵寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">五番札所</p>

    <h2 class="card-title">
        <ruby>
            無尽山・地蔵寺
            <rt>むじんざん・じぞうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県板野郡板野町羅漢字林東5</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・御堂派</p>
        <p><strong>御本尊：</strong> 勝軍地蔵菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（境内横・50台・無料）</p>
        <p><strong>納経所：</strong> 門をくぐって直進</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=地蔵寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        樹齢およそ800年の大銀杏の木、奥の院にある等身大の五百羅漢がある。羅漢とはお釈迦さんの弟子で仏教の修行を積み、最高の位を
        得た人たち。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>

</html>
