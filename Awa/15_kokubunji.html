<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">十五番札所</p>

    <h2 class="card-title">
        <ruby>
            薬王山・国分寺
            <rt>やくおうざん・こくぶんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県徳島市国府町矢野718-1</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 曹洞宗 </p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（境内直結・10台・無料）</p>
        <p><strong>納経所：</strong> 庭園入り口（大師堂裏）</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=国分寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
       「 阿波国分寺庭園」と呼ばれる本堂横の庭園は池泉鑑賞兼枯山水の大庭園で、二つの型式の庭が連なった独自の様式を持つ。普段は非公開だが事前に申し込めば見学できる。
    </p>

</div>
