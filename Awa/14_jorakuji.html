<body>
<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">十四番札所</p>

    <h2 class="card-title">
        <ruby>
            盛寿山・常楽寺
            <rt>せいじゅざん・じょうらくじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県徳島市国府町延命606</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 弥勒菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（徒歩すぐ・10台・無料）</p>
        <p><strong>納経所：</strong> 階段で上がってすぐ</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=徳島県　常楽寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        流水岩の庭と呼ばれるゴツゴツした断層が重なる自然の大岩盤でできた庭がある。
    </p>

</div>
