<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大日寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">四番札所</p>

    <h2 class="card-title">
        <ruby>
            黒巌山・大日寺
            <rt>こくがんざん・だいにちじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県板野郡板野町黒谷字居内5</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 大日如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（山門前・20台・無料）</p>
        <p><strong>納経所：</strong> 本堂の左手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=徳島県　大日寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        本堂と大師堂をつなぐ回廊に安置された三十二体の木造観音は必見。「黒谷川」が山中に流れており、背後に山があり、豊かな緑と木に恵まれている。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
