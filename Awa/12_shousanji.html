<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>焼山寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/tokushima-134843608.jpg" alt="">

    <p class="card-number">十二番札所</p>

    <h2 class="card-title">
        <ruby>
            摩廬山・焼山寺
            <rt>まろざん・しょうさんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県名西郡神山町下分中318</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 虚空蔵菩薩</p>
        <p><strong>ご利益：</strong> 長寿</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（山道利用料として普通車一台につき心付け300円・100台）</p>
        <p><strong>納経所：</strong> 山門をくぐって左手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり （100人・要予約）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=徳島県　焼山寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        中央に大黒天、右面に御沙門天、左面に弁財天の像が彫られた三面大黒天が祀られている三面大黒堂がある。厄除けや招福に御利益がある。
        根回り5mの樹齢約300年の杉の巨木があり天然記念物に指定されている。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
