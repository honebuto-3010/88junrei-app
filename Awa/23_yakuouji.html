<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>薬王寺</title>
    <link rel="stylesheet" href="css/tokushima.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Awa/134843608.jpg" alt="">

    <p class="card-number">二十三番札所</p>

    <h2 class="card-title">
        <ruby>
             医王山・薬王寺
            <rt>いおうざん・やくおうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県美波町奥河内寺前285-1</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong> 厄除け </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（徒歩2分・350台・無料）</p>
        <p><strong>納経所：</strong> 仁王門の手前を右へすぐ</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=薬王寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        男厄坂42段、女厄坂33段、還暦厄坂61段の坂がある。1段ごとに賽銭を置いて上っていくのが習わしになっている。高さ29m、上方が四角、下方が円筒形の
        一重の塔があり展望台となっており戒壇めぐりが可能。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
