    <title>十楽寺</title>
    <link rel="stylesheet" href="css/tokushima.css">

<body>
<div class="card-brush">

    <img src="Awa/134843608.jpg" alt="">

    <p class="card-number">六番札所</p>

    <h2 class="card-title">
        <ruby>
            光明山・十楽寺
            <rt>こうみょうざん・じゅうらくじ</rt>
        </ruby>
    </h2>

    <p class="card-address">徳島県阿波市土成町高尾字法教田58</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・高野山派</p>
        <p><strong>御本尊：</strong> 阿弥陀如来</p>
        <p><strong>ご利益：</strong>眼病</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（山門すぐ横・30台・無料）</p>
        <p><strong>納経所：</strong> 愛染堂をくぐって右手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong>あり（1泊2食付 7560円～、予約制）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=十楽寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        上層が朱塗り、下層が白い漆喰の山門は竜宮城の入り口を彷彿とさせる。治眼疾目救歳地蔵尊があり巡礼中に眼が見えるようになったという
        言い伝えも多く残る。
    </p>

</div>
