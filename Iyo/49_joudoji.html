<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浄土寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">四十九番札所</p>

    <h2 class="card-title">
        <ruby>
            西林山・浄土寺
            <rt>さいりんざん・じょうどじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県松山市鷹子町1198</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・豊山派</p>
        <p><strong>御本尊：</strong> 釈迦如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（30台・有料・門前）</p>
        <p><strong>納経所：</strong> 門をくぐって右手（小さな門をくぐる）</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=浄土寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        口から6体の像がでている空也上人像が残る古刹。本堂も国の重要文化財。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
