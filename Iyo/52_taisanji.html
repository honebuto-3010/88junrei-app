<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太山寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Iyo/ehime-134843608.jpg" alt="">

    <p class="card-number">五十二番札所</p>

    <h2 class="card-title">
        <ruby>
            龍雲山・太山寺
            <rt>りゅううんざん・たいさんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県松山市太山寺町1730</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・智山派</p>
        <p><strong>御本尊：</strong> 十一面観世音菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（50台・無料・仁王門過ぎて4ヶ所（納経所手前2ヶ所・納経所1ヶ所・本堂近く1ヶ所））</p>
        <p><strong>納経所：</strong> 仁王門から本堂へ向かう途中の左手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=太山寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        歴代天皇に帰依され、貴重な文化財が残る札所。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
