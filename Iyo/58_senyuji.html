<body>
<div class="card-brush">

    <img src="Iyo/ehime-134843608.jpg" alt="">

    <p class="card-number">五十八番札所</p>

    <h2 class="card-title">
        <ruby>
            作礼山・仙遊寺
            <rt>されいざん・せんゆうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県今治市玉川町別府甲483</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 高野山真言宗</p>
        <p><strong>御本尊：</strong> 千手観音菩薩 </p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（30台・参道維持費400円・本堂裏にあり）</p>
        <p><strong>納経所：</strong> 本堂内</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり（1泊2食付6000円～・予約制） </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=愛媛県　仙遊寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        「おされさん」と親しまれ、仙人が修行したとされる伝説がある。大師像のまわりに八十八ヶ所御砂踏霊場があり全てお参りできない
        場合はここでしておきたい。
    </p>

</div>
