<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泰山寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">五十六番札所</p>

    <h2 class="card-title">
        <ruby>
            金輪山・泰山寺
            <rt>きんりんざん・たいさんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県今治市小泉1-9-18</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗</p>
        <p><strong>御本尊：</strong> 地蔵菩薩 </p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（40台・1回200円）</p>
        <p><strong>納経所：</strong> 敷地に入る階段を上がって正面右手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=泰山寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        水難の死者や悪霊のたたりを鎮めた伝説の寺。弘法大師が植えたとされる「不忘松」があり、切り株に座ると腰痛に
        ご利益があるとされる。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>

</html>
