<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>岩屋寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Iyo/ehime-134843608.jpg" alt="">

    <p class="card-number">四十五番札所</p>

    <h2 class="card-title">
        <ruby>
            海岸山・岩屋寺
            <rt>かいがんざん・いわやじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県上浮穴群久万高原町七鳥1468</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・豊山派</p>
        <p><strong>御本尊：</strong> 不動明王</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> なし（近隣駐車場を利用・15～20分ずっと上り）</p>
        <p><strong>納経所：</strong> 本堂の階段へ上がる前の右手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=愛媛県　岩屋寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        山と本堂が一体化した美景の圧倒される深山の札所。本堂へ上る石段の右手に弘法大師が掘ったという穴禅定があり、「独鈷の雲水」と
        呼ばれる湧水がある。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
