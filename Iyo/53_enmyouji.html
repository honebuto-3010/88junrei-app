<!DOCTYPE html>

<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">五十三番札所</p>

    <h2 class="card-title">
        <ruby>
            須賀山・圓明寺
            <rt>すがさん・えんみょうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県松山市和気町1-182</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・智山派</p>
        <p><strong>御本尊：</strong> 阿弥陀如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（10台・無料・門前）</p>
        <p><strong>納経所：</strong> 門をくぐって右手 </p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=圓明寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        江戸時代の町人が納めた、最古の納札が発見された札所。八十八ヶ所では珍しいキリシタン灯籠があり、マリア観音と呼ばれる
        像がある。
    </p>

</div>
