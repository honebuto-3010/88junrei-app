<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">四十七番札所</p>

    <h2 class="card-title">
        <ruby>
            熊野山・八坂寺
            <rt>くまのざん・やさかじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県松山市浄瑠璃町八坂773</p>

        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=八坂寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        遍路の元祖といわれる衛門三郎が遍路を始めた札所。
    </p>

</div>
