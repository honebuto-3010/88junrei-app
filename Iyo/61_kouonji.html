<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>香園寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Iyo/ehime-134843608.jpg" alt="">

    <p class="card-number">六十一番札所</p>

    <h2 class="card-title">
        <ruby>
            栴檀山・香園寺
            <rt>せんだんさん・こうおんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県西条市小松町南川甲19</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・御堂派</p>
        <p><strong>御本尊：</strong> 大日如来 </p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（50台・無料・境内前）</p>
        <p><strong>納経所：</strong> 大聖堂の左</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=香園寺 target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        子安大師の寺として親しまれるモダンな雰囲気が漂う寺院。背中にゴザ、右手に杖、左手に赤ん坊を抱いた大師
        の像がある。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
