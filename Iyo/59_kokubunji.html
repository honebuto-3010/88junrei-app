<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国分寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">五十九番札所</p>

    <h2 class="card-title">
        <ruby>
            金光山・国分寺
            <rt>こんこうさん・こくぶんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県今治市国分4-1-33</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言律宗</p>
        <p><strong>御本尊：</strong> 薬師瑠璃光如来 </p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（50台・1回200円・進入路と門前に駐車場2ヶ所）</p>
        <p><strong>納経所：</strong> 本堂の左手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=国分寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        焼失と復興を繰り返した歴史と文化を物語る寺院。薬師如来の持ち物とされる「薬師のつぼ」があり
        壺に書いてある部位にさわると治療すると伝わっている。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
