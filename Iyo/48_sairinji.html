    <p class="card-number">四十八番札所</p>

    <h2 class="card-title">
        <ruby>
            清滝山・西林寺
            <rt>せいりゅうざん・さいりんじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県松山市高井町1007</p>

        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=愛媛県　西林寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        日本名水百選のひとつである弘法大師ゆかりの湧き水がある。杖で湧かせたとされる「杖の淵」。
    </p>
