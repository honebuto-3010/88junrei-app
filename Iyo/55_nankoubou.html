<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>南光坊</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Iyo/ehime-134843608.jpg" alt="">

    <p class="card-number">五十五番札所</p>

    <h2 class="card-title">
        <ruby>
            別宮山・南光坊
            <rt>べっくざん・なんこうぼう</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県今治市別宮町3-1</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・御堂派</p>
        <p><strong>御本尊：</strong> 大通智勝如来 </p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（20台・無料・門を回り込んで境内に駐車）</p>
        <p><strong>納経所：</strong> 境内の南側</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=愛媛県　南光坊" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        1300年前に起源を持つ四国八十八ヶ所で唯一の「坊」。金比羅堂や松尾芭蕉句碑もある。
    </p>

</div>
