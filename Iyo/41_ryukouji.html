<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>龍光寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Iyo/ehime-134843608.jpg" alt="">

    <p class="card-number">四十一番札所</p>

    <h2 class="card-title">
        <ruby>
            稲荷山・龍光寺
            <rt>いなりさん・りゅうこうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県宇和島市三間町戸雁173</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・御室派</p>
        <p><strong>御本尊：</strong> 十一面観世音菩薩</p>
        <p><strong>ご利益：</strong> 五穀豊穣・商売繁盛</p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（境内の下・10台・無料）</p>
        <p><strong>納経所：</strong> 本堂左手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=愛媛県　龍光寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        弘法大師がこの地で稻束を背負った老人と出会い、五穀大明神の化身であると感得し稲荷明神像を彫り安置した。神仏混交
        の面影がある。「三間のお稲荷さん」と呼ばれ親しまれている。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
