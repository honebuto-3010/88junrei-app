<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>大寶寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

<body>
<div class="card-brush">

    <img src="Iyo/ehime-134843608.jpg" alt="">

    <p class="card-number">四十四番札所</p>

    <h2 class="card-title">
        <ruby>
            菅生山・大寶寺
            <rt>すごうざん・だいほうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県上浮穴群久万高原町菅生1173-2</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・豊山派</p>
        <p><strong>御本尊：</strong> 十一面観世音</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（遍路道入り口と境内すぐの2ヶ所・30台・無料）</p>
        <p><strong>納経所：</strong> 本堂への階段を上がる前の右手</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり（1泊2食付6000円～・団体の予約があるときのみ空きがあれば宿泊可・予約制）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=大寶寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        山門に巨大なわらじが奉納されている山の札所。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
