<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>横峰寺</title>
    <link rel="stylesheet" href="css/ehime.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Iyo/ehime-134843608.jpg" alt="">

    <p class="card-number">六十番札所</p>

    <h2 class="card-title">
        <ruby>
            石鈇山・横峰寺
            <rt>いしづちさん・よこみねじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県西条市小松町石鎚甲2253</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・御堂派</p>
        <p><strong>御本尊：</strong> 大日如来 </p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（50台・1回1850円・林道通行料含む・駐車場から徒歩15分）</p>
        <p><strong>納経所：</strong> 本堂右の階段を下りてすぐ</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=愛媛県　横峰寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        山岳信仰の聖地、石鎚山系に建つ幽玄な趣の札所。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
