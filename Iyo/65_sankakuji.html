    <h2 class="card-title">
        <ruby>
            由霊山・三角寺
            <rt>ゆれいざん・さんかくじ</rt>
        </ruby>
    </h2>

    <p class="card-address">愛媛県四国中央市金田町三角寺甲75</p>

        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>

            <a href="https://maps.google.com/?q=愛媛県　三角寺" target="_blank">地図を見る</a>
        </p>

    <p class="card-desc">
        江戸の俳人が感銘を受けた山桜が咲く、愛媛最後の寺。
    </p>
