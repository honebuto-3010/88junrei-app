<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>善通寺</title>
    <link rel="stylesheet" href="css/kagawa.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Sanuki/kagawa-134843608.jpg" alt="">

    <p class="card-number">七十五番札所</p>

    <h2 class="card-title">
        <ruby>
            五岳山・善通寺
            <rt>ごがくさん・ぜんつうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">香川県善通寺市善通寺町3-3-1</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・善通寺派</p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（200台・1回300円・境内西）</p>
        <p><strong>納経所：</strong> 橋を渡って道なりに2分</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり（1泊2食付8000円～・予約制）</p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=香川県　善通寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        弘法大師誕生の地に建つ東西2院の広大な寺。五重塔や五社明神、宝物館がある。
        御影堂の地下には戒壇があり、再現された大師の声を聞くことができる。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
