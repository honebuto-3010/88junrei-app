<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>金倉寺</title>
    <link rel="stylesheet" href="css/kagawa.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">七十六番札所</p>

    <h2 class="card-title">
        <ruby>
            鶏足山・金倉寺
            <rt>けいそくざん・こんぞうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">香川県善通寺市金蔵寺町1160</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 天台寺門宗</p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（50台・1回200円・境内横）</p>
        <p><strong>納経所：</strong> 本堂の右側 </p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=金倉寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        天台寺門宗の開祖である智証大師と弘法大師を祀る。「大黒天」は願をかけながらおみくじに付いている金箔
        を張るとご利益がある。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>
</body>
</html>
