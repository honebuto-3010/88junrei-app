<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>神恵院</title>
    <link rel="stylesheet" href="css/kagawa.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">六十八番札所</p>

    <h2 class="card-title">
        <ruby>
            七宝山・神恵院
            <rt>しっぽうざん・じんねいん</rt>
        </ruby>
    </h2>

    <p class="card-address">香川県観音寺市八幡町1-2-7 観音寺内</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・大覚寺派</p>
        <p><strong>御本尊：</strong> 阿弥陀如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（20台・無料・山門前・駐車場から階段を上って5分）</p>
        <p><strong>納経所：</strong> 山門をくぐって階段を上り左へ</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=神恵院" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        コンクリート造りの近代造形が美しい本堂を持つ。本堂手前にある山の斜面や岩石、流水を巧みに
        利用した回遊式庭園「魏魏園」が美しい。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>

</html>
