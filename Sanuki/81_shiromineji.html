<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>白峰寺</title>
    <link rel="stylesheet" href="css/kagawa.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Sanuki/kagawa-134843608.jpg" alt="">

    <p class="card-number">八十一番札所</p>

    <h2 class="card-title">
        <ruby>
            綾松山・白峰寺
            <rt>りょうしょうざん・しろみねじ</rt>
        </ruby>
    </h2>

    <p class="card-address">香川県坂出市青海町2635</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・御室派</p>
        <p><strong>御本尊：</strong> 千手観世音菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00（冬期は7:30～16:30）</p>
        <p><strong>駐車場：</strong> あり（200台・無料・30分以上の駐車厳禁・正月は有料・山門前）</p>
        <p><strong>納経所：</strong> 護摩堂内</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> あり（1泊2食付7500円・10名以上の団体のみ・予約制） </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=白峰寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        弘法・智証の両大師によって開基された名刹。
        源頼朝が崇徳上皇の菩提のため建立した「供養塔」がある。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
