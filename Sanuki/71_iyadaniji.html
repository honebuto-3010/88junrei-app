<body>
<div class="card-brush">

    <img src="images/134843608.jpg" alt="">

    <p class="card-number">七十一番札所</p>

    <h2 class="card-title">
        <ruby>
            剣五山・弥谷寺
            <rt>けんござん・いやだにじ</rt>
        </ruby>
    </h2>

    <p class="card-address">香川県三豊市三野町大見乙70</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・善通寺派</p>
        <p><strong>御本尊：</strong> 千手観世音菩薩</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（200台・1回500円・中腹、山上駐車場から本堂まで徒歩15分）</p>
        <p><strong>納経所：</strong> 大師堂内</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=弥谷寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        日本三大霊場のひとつで弘法大師が学んだ岩窟が残る。「獅子之岩窟」とよばれる煩悩や病などを払うといわれるものがある。
        「阿弥陀仏三尊磨崖仏」は真言を唱えると極楽往生ができる。
    </p>

</div>
