<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>道隆寺</title>
    <link rel="stylesheet" href="css/kagawa.css">
    <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">

</head>
<body>
<div class="card-brush">

    <img src="Sanuki/kagawa-134843608.jpg" alt="">

    <p class="card-number">七十七番札所</p>

    <h2 class="card-title">
        <ruby>
            桑多山・道隆寺
            <rt>そうたざん・どうりゅうじ</rt>
        </ruby>
    </h2>

    <p class="card-address">香川県仲多度群多度津町北鴨1-3-30</p>

    <div class="info-box">
        <p><strong>宗派：</strong> 真言宗・醍醐派</p>
        <p><strong>御本尊：</strong> 薬師如来</p>
        <p><strong>ご利益：</strong> </p>
        <p><strong>開門時間：</strong> 7:00〜17:00</p>
        <p><strong>駐車場：</strong> あり（20台・無料・山門横）</p>
        <p><strong>納経所：</strong> 手水舎の左側</p>
        <p><strong>御朱印：</strong> 通常御朱印あり</p>
        <p><strong>宿坊：</strong> なし </p>
        <p class="map-link">
            <a href="https://maps.google.com/?q=香川県　道隆寺" target="_blank">地図を見る</a>
        </p>
    </div>

    <p class="card-desc">
        眼病に霊験があり「眼なおし薬師」と慕われる薬師如来。「びんずるさま」は釈迦の弟子である羅漢のひとり。
        病気の人が像をなで、その手で自身の悪いところをさすると良くなるといわれている。
    </p>

</div>
<div class="back-buttons">
    <button class="btn-back-home">ホームに戻る</button>
    <button class="btn-back-list">一覧に戻る</button>
</div>

</html>
